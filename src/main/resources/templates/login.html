<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login — Entre Trazo</title>
</head>
<body>
    <h1>Entre Trazo — Panel Admin</h1>
    <form action="/admin/login" method="post">
        <p>
            <label>Usuario:</label><br>
            <input type="text" name="username">
        </p>
        <p>
            <label>Contraseña:</label><br>
            <input type="password" name="password">
        </p>
        <button type="submit">Entrar</button>
        <p th:if="${error}" style="color:red">Usuario o contraseña incorrectos</p>
    </form>
</body>
</html>
