<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre Trazo — Arquitectura y Construcción</title>
    <style>
        :root {
            --bg: #fafaf8;
            --text: #1a1a18;
            --muted: #8a8880;
            --accent: #afb3b1;
            --border: #e8e6e0;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex; align-items: center; justify-content: center; /* Centramos el logo */
            padding: 32px 48px;
            border-bottom: 1px solid var(--border);
            background: white;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px; font-weight: 300;
            letter-spacing: 0.2em; text-transform: uppercase;
        }

        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .btn-principal {
            display: inline-block;
            padding: 20px 50px;
            background: var(--text);
            color: var(--bg);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-principal:hover {
            background: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">Entre Trazo</div>
</nav>

<main class="hero">
    <a href="cotizacion.html" class="btn-principal">Solicitar Cotización</a>
</main>

</body>
</html>
